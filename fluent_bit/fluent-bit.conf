[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name          tail
    Path          /var/lib/docker/containers/*/*.log
    Tag           docker.*
    Parser        docker
    Mem_Buf_Limit 5MB

[OUTPUT]
    Name          forward
    Match         docker.*
    Host          logstash.evilcouncil.org
    Port          24224
